<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1d3a22" />
    <title>Rugby Coach</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14261a; overflow: hidden; overscroll-behavior: none;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff; }
      #app { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent; }
      canvas { display: block; width: 100%; height: 100%; }
      .hud { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between;
        gap: 8px; padding: calc(env(safe-area-inset-top) + 8px) 12px 6px; font-size: 14px; font-weight: 600;
        background: linear-gradient(#000a, #0000); pointer-events: none; }
      .hud span b { font-size: 18px; }
      .hint { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: 13px;
        padding: 8px 12px calc(env(safe-area-inset-bottom) + 10px); background: linear-gradient(#0000, #000a);
        pointer-events: none; opacity: .9; }
      .dice { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 50px); text-align: center;
        font-size: 13px; font-variant-numeric: tabular-nums; opacity: .85; pointer-events: none; text-shadow: 0 1px 2px #000; }
      .reload { position: absolute; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 40px); font: inherit;
        font-size: 12px; color: #fff; background: #0008; border: 1px solid #fff4; border-radius: 14px; padding: 4px 10px; }
      .banner { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); text-align: center;
        padding: 10px 18px; border-radius: 12px; background: #000b; pointer-events: none; opacity: 0;
        transition: opacity .15s; min-width: 180px; }
      .banner.show { opacity: 1; }
      .banner .title { font-size: 28px; font-weight: 800; letter-spacing: 1px; }
      .banner .sub { font-size: 14px; margin-top: 4px; opacity: .9; font-variant-numeric: tabular-nums; }
      .banner.good .title { color: #7dff9b; } .banner.bad .title { color: #ff8a7d; } .banner.warn .title { color: #ffd36b; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div class="hud">
        <span>Tries <b id="s-tries">0</b></span>
        <span>Tackled <b id="s-tackled">0</b></span>
        <span>Errors <b id="s-errors">0</b></span>
        <span>Streak <b id="s-streak">0</b></span>
      </div>
      <div class="dice" id="dice"></div>
      <button class="reload" id="reload" aria-label="Load latest version">↻ <span id="version"></span></button>
      <div class="banner" id="banner"><div class="title"></div><div class="sub"></div></div>
      <div class="hint" id="hint">Tap an attacker to pass to him · tap past a mate to skip</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
